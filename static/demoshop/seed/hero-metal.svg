<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" fill="none">
  <!-- Dark graphite background -->
  <rect width="2560" height="1440" fill="#3a3a3a"/>
  
  <!-- Line-drawn steel shelving silhouette (left) -->
  <g stroke="#707070" stroke-width="3" fill="none">
    <rect x="280" y="380" width="320" height="480"/>
    <line x1="280" y1="520" x2="600" y2="520"/>
    <line x1="280" y1="660" x2="600" y2="660"/>
    <line x1="280" y1="800" x2="600" y2="800"/>
    <line x1="380" y1="380" x2="380" y2="860"/>
    <line x1="500" y1="380" x2="500" y2="860"/>
  </g>
  
  <!-- Line-drawn bench silhouette (center) -->
  <g stroke="#707070" stroke-width="3" fill="none">
    <rect x="920" y="620" width="280" height="60"/>
    <line x1="940" y1="680" x2="940" y2="820"/>
    <line x1="1180" y1="680" x2="1180" y2="820"/>
    <rect x="920" y="820" width="40" height="20"/>
    <rect x="1160" y="820" width="40" height="20"/>
  </g>
  
  <!-- Line-drawn cabinet silhouette (right) -->
  <g stroke="#707070" stroke-width="3" fill="none">
    <rect x="1560" y="400" width="280" height="460"/>
    <line x1="1700" y1="400" x2="1700" y2="860"/>
    <line x1="1560" y1="630" x2="1840" y2="630"/>
    <circle cx="1640" cy="720" r="8"/>
    <circle cx="1760" cy="520" r="8"/>
  </g>
  
  <!-- Small DEMO mark (top right) -->
  <text x="2420" y="80" text-anchor="end" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#909090">DEMO</text>
  
  <!-- Subtle grid texture -->
  <g opacity="0.05">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect width="2560" height="1440" fill="url(#grid)"/>
  </g>
</svg>
