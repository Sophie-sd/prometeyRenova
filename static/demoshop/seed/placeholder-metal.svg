<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A4A4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g transform="translate(400,400)">
    <!-- Simple furniture silhouette -->
    <rect x="-120" y="-80" width="240" height="10" fill="#787878" stroke="#5A5A5A" stroke-width="2"/>
    <rect x="-120" y="-70" width="240" height="100" fill="none" stroke="#787878" stroke-width="3"/>
    <line x1="-120" y1="-70" x2="-120" y2="30" stroke="#787878" stroke-width="3"/>
    <line x1="120" y1="-70" x2="120" y2="30" stroke="#787878" stroke-width="3"/>
    <line x1="-90" y1="-70" x2="-90" y2="30" stroke="#787878" stroke-width="2" opacity="0.6"/>
    <line x1="90" y1="-70" x2="90" y2="30" stroke="#787878" stroke-width="2" opacity="0.6"/>
    <rect x="-115" y="30" width="10" height="60" fill="#5A5A5A"/>
    <rect x="105" y="30" width="10" height="60" fill="#5A5A5A"/>
    <rect x="-85" y="30" width="10" height="60" fill="#5A5A5A"/>
    <rect x="75" y="30" width="10" height="60" fill="#5A5A5A"/>
  </g>
  <text x="400" y="650" font-family="Arial, sans-serif" font-size="36" fill="#999" text-anchor="middle" font-weight="300">DEMO</text>
</svg>
