{% extends "admin/base_site.html" %}
{% block content %}
<div class="max-w-2xl">
  <h1 class="text-xl font-semibold mb-4">{{ title }}</h1>
  {% if intro %}<p class="mb-4">{{ intro }}</p>{% endif %}
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-primary-600 text-white px-4 py-2 rounded">{{ submit_label }}</button>
  </form>
  {% if downloads %}
  <h2 class="text-lg font-semibold mt-8 mb-2">Шаблони та інструкція</h2>
  <ul class="list-disc pl-6">
    {% for label, url in downloads %}<li><a class="text-primary-600 underline" href="{{ url }}">{{ label }}</a></li>{% endfor %}
  </ul>
  {% endif %}
</div>
{% endblock %}
