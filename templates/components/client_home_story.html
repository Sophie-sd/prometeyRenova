<div class="project-story-wrap"{% if is_clone %} aria-hidden="true"{% else %} role="listitem"{% endif %}>
    <a href="{% url 'portfolio' %}" class="project-story v3-client{% if is_clone %} story-clone{% endif %}"{% if is_clone %} data-clone="true" tabindex="-1"{% endif %}>
        <div class="v3-client-halo" aria-hidden="true"></div>
        <div class="v3-client-ring">
            <div class="v3-client-inner">
                {% if client.get_logo_url %}
                <picture>
                    {% if client.get_logo_webp_228_url %}
                    <source type="image/webp" srcset="{{ client.get_logo_webp_228_url }} 1x{% if client.get_logo_webp_456_url %}, {{ client.get_logo_webp_456_url }} 2x{% endif %}">
                    {% endif %}
                    <img src="{{ client.get_logo_url }}" alt="" width="296" height="296" loading="lazy" decoding="async">
                </picture>
                {% endif %}
            </div>
        </div>
        <span class="project-story-name v3-client-name">{{ client.name }}</span>
    </a>
</div>
