<section id="free-analysis" class="pl-corp__free-analysis pl-corp__section" aria-labelledby="pl-corp-free-analysis-title">
    <div class="pl-corp__inner">
        <div class="pl-corp__free-analysis-card" data-reveal>
            <h2 id="pl-corp-free-analysis-title" class="pl-corp__free-analysis-title">
                Безкоштовний аналіз вашого бізнесу
            </h2>
            <p class="pl-corp__free-analysis-desc">
                Залиште номер телефону — підготуємо короткий аналіз і зателефонуємо з рекомендаціями.
            </p>
            <form
                class="pl-corp__free-analysis-form"
                method="post"
                action="{% url 'form_submit' %}"
                data-form-type="call_request"
            >
                {% csrf_token %}
                <input type="hidden" name="form_type" value="call_request">
                <input type="hidden" name="source_page" value="corporate-website-v2-free-analysis">
                <input type="hidden" name="name" value="Безкоштовний аналіз">
                <div class="pl-corp__free-analysis-row">
                    <input
                        type="tel"
                        name="phone"
                        class="pl-corp__free-analysis-input mobile-touch-target"
                        autocomplete="tel"
                        inputmode="tel"
                        placeholder="+38(___)__-__-___"
                        required
                        aria-label="Номер телефону"
                    >
                    <button type="submit" class="pl-corp__btn pl-corp__btn--primary pl-corp__free-analysis-submit mobile-touch-target">
                        Отримати консультацію
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
