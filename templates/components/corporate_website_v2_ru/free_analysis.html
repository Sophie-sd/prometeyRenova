{% load static %}
<section id="free-analysis" class="pl-corp__lead-cta" aria-labelledby="pl-corp-free-analysis-title">
    <div class="pl-corp__inner">
        <div class="pl-corp__lead-cta-row" data-reveal>
            <div class="pl-corp__lead-cta-copy">
                <h2 id="pl-corp-free-analysis-title" class="pl-corp__lead-cta-title"><span class="pl-corp__accent">Бесплатный</span> анализ сайта и консультация</h2>
                <p class="pl-corp__lead-cta-text">Оставьте номер телефона — подготовим короткий анализ вашего сайта и позвоним с рекомендациями</p>
            </div>
            <form class="pl-corp__lead-cta-form" method="post" action="{% url 'form_submit' %}" data-form-type="call_request">
                {% csrf_token %}
                <input type="hidden" name="form_type" value="call_request">
                <input type="hidden" name="source_page" value="corporate-website-v2-free-analysis">
                <input type="hidden" name="name" value="Бесплатный анализ">
                <label class="pl-corp__field">
                    <img class="pl-corp__field-icon" src="{% static 'images/corporate_website_v2/figma/icon-call.svg' %}" alt="" width="14" height="14">
                    <span class="pl-corp__sr-only">Номер телефона</span>
                    <input type="tel" name="phone" class="pl-corp__field-input mobile-touch-target" autocomplete="tel" inputmode="tel" placeholder="Номер телефона" required>
                </label>
                <button type="submit" class="pl-corp__btn pl-corp__btn--accent mobile-touch-target">Получить консультацию</button>
            </form>
        </div>
    </div>
</section>
