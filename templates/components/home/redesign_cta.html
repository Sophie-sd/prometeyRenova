{% load i18n static %}
<section class="cta-section home-redesign home-cta-section" aria-label="{% trans 'Готові почати?' %}">
    <video class="video-background desktop-video" autoplay muted loop playsinline preload="metadata" data-shared-video="main">
        <source src="{% static 'videos/desktop/main.mp4' %}" type="video/mp4">
    </video>
    <video class="video-background mobile-video" autoplay muted loop playsinline preload="metadata" data-shared-video="main">
        <source src="{% static 'videos/mobile/mainmobile.mp4' %}" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="home-cta-section__inner">
        <div class="home-cta-section__body vf-cta-center">
        <h2 class="v2-h2 v2-cta-h2">
            {% trans "ГОТОВІ" %}<br>
            <span class="v2-orange">{% trans "ПОЧАТИ?" %}</span>
        </h2>
        <p class="v2-cta-text">
            {% trans "Зв'яжіться з нами для безкоштовної консультації та розрахунку вартості проєкту" %}
        </p>
        <div class="v2-cta-btns">
            <a href="{% url 'calculator' %}" class="v2-btn v2-btn-primary v2-btn-lg">
                <span>{% trans "Розрахувати вартість" %}</span>
                <span class="v2-arrow" aria-hidden="true">→</span>
            </a>
            <a href="https://t.me/prometeylabs" class="v2-btn v2-btn-lg" target="_blank" rel="noopener">
                <span>{% trans "telegram-консультація" %}</span>
                <span class="v2-arrow" aria-hidden="true">→</span>
            </a>
        </div>
        </div>
    </div>
</section>
