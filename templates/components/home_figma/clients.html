{% load i18n static %}
<section class="hf-clients" id="clients" aria-labelledby="hf-clients-title">
    <div class="hf-wrap hf-clients__inner">
        <h2 class="hf-h2" id="hf-clients-title">{% trans "Наші клієнти" %}</h2>
        <ul class="hf-clients__list">
            {% for client in home_clients %}
            <li class="hf-clients__item">
                <a href="{% url 'portfolio' %}" class="hf-clients__logo" title="{{ client.name }}">
                    {% if client.get_logo_url %}
                    <picture>
                        {% if client.get_logo_webp_228_url %}<source type="image/webp" srcset="{{ client.get_logo_webp_228_url }} 1x{% if client.get_logo_webp_456_url %}, {{ client.get_logo_webp_456_url }} 2x{% endif %}">{% endif %}
                        <img src="{{ client.get_logo_url }}" alt="{{ client.name }}" width="128" height="128" loading="lazy" decoding="async">
                    </picture>
                    {% else %}<span>{{ client.name }}</span>{% endif %}
                </a>
            </li>
            {% endfor %}
        </ul>
        <a href="{% url 'portfolio' %}" class="hf-btn hf-btn--brand">
            <span>{% trans "Переглянути портфоліо" %}</span>
            <img src="{% static 'images/home-figma/arrow.svg' %}" width="18" height="12" alt="" aria-hidden="true">
        </a>
    </div>
</section>
