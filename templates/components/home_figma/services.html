{% load i18n %}
<section class="hf-services hf-wrap" id="services" aria-labelledby="hf-services-title">
    <h2 class="hf-h2" id="hf-services-title">{% trans "Послуги" %}<br><span class="hf-accent">PrometeyLabs</span></h2>
    <div class="hf-services__list">
        <button type="button" class="hf-card hf-service" data-modal="service-web-modal">
            <span class="hf-service__title">{% trans "Веброзробка" %}</span>
            <span class="hf-service__quote">{% trans "Сайти під ключ, лендінги, інтернет-магазини, вебзастосунки та Telegram-боти." %}</span>
        </button>
        <button type="button" class="hf-card hf-service" data-modal="service-mobile-modal">
            <span class="hf-service__title">{% trans "Мобільні застосунки" %}</span>
            <span class="hf-service__quote">{% trans "iOS та Android-застосунки із сучасним дизайном і зручним користувацьким досвідом" %}</span>
        </button>
        <button type="button" class="hf-card hf-service" data-modal="service-smm-modal">
            <span class="hf-service__title">{% trans "Реклама та SMM" %}</span>
            <span class="hf-service__quote">{% trans "Google Ads, Meta Ads, TikTok Ads, SMM і створення контенту для соціальних мереж" %}</span>
        </button>
        <button type="button" class="hf-card hf-service" data-modal="service-ai-modal">
            <span class="hf-service__title">{% trans "AI-автоматизація" %}</span>
            <span class="hf-service__quote">{% trans "Інтеграція штучного інтелекту в сайти, CRM та бізнес-процеси — від AI-консультантів до автоматизації рутинних завдань." %}</span>
        </button>
    </div>
</section>
