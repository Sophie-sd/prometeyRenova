{% load static %}
<section id="top" class="pl-shop__hero" aria-labelledby="pl-shop-hero-title">
    <picture class="pl-shop__hero-bg" aria-hidden="true">
        <source media="(max-width: 767px)" srcset="{% static 'images/internet_shop_v2/figma/bg-hero-mobile.webp' %}" width="393" height="1440">
        <img src="{% static 'images/internet_shop_v2/figma/bg-hero-1440.webp' %}" srcset="{% static 'images/internet_shop_v2/figma/bg-hero-960.webp' %} 960w, {% static 'images/internet_shop_v2/figma/bg-hero-1440.webp' %} 1440w" sizes="100vw" alt="" width="1440" height="1440" fetchpriority="high" decoding="async">
    </picture>
    <div class="pl-shop__inner pl-shop__hero-inner">
        <div class="pl-shop__hero-head">
            <h1 id="pl-shop-hero-title" class="pl-shop__title pl-shop__title--hero">Створення інтернет-магазину під ключ</h1>
            <p class="pl-shop__hero-line">Від 800€. Запуск за 3 тижні. 1 рік підтримки безкоштовно.</p>
            <p class="pl-shop__hero-lead">Дизайн, код і інтеграції. Без плагінів і без щомісячної абонплати. Магазин залишається вашим.</p>
        </div>

        <div class="pl-shop__hero-card">
            <form
                id="pl-shop-hero-form"
                class="pl-shop__hero-form"
                action="{% url 'form_submit' %}"
                method="post"
                data-form-type="site_request"
                data-source-label="Інтернет-магазин v2 · перший екран"
                aria-label="Заявка на розрахунок вартості"
            >
                {% csrf_token %}
                <input type="hidden" name="form_type" value="site_request">
                <input type="hidden" name="source_page" value="internet-shop-v2">
                <input type="hidden" name="details" value="Сторінка: Інтернет-магазин v2 · Форма на першому екрані">
                <div class="pl-shop__field">
                    <label class="pl-shop__sr-only" for="pl-shop-hero-name">Ім’я</label>
                    <img class="pl-shop__field-icon" src="{% static 'images/internet_shop_v2/figma/icon-profile.svg' %}" alt="" width="18" height="18" aria-hidden="true">
                    <input type="text" id="pl-shop-hero-name" name="name" class="pl-shop__field-input" autocomplete="given-name" inputmode="text" required placeholder="Ім’я">
                </div>
                <div class="pl-shop__field">
                    <label class="pl-shop__sr-only" for="pl-shop-hero-phone">Телефон</label>
                    <img class="pl-shop__field-icon" src="{% static 'images/internet_shop_v2/figma/icon-call.svg' %}" alt="" width="18" height="18" aria-hidden="true">
                    <input type="tel" id="pl-shop-hero-phone" name="phone" class="pl-shop__field-input" autocomplete="tel" inputmode="tel" required placeholder="Номер телефону">
                </div>
                <button type="submit" class="pl-shop__btn pl-shop__btn--light pl-shop__hero-submit">Дізнатися вартість</button>
            </form>
            <p class="pl-shop__hero-contacts">
                <a href="{{ site_contact.get_tel_href }}" class="pl-shop__hero-contact">{{ site_contact.phone_display }}</a>
                <a href="{{ site_contact.telegram_url }}" class="pl-shop__hero-contact" target="_blank" rel="noopener noreferrer">Telegram</a>
            </p>
        </div>
    </div>
</section>
