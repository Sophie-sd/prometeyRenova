{% load i18n static %}
<section class="pl-rs-new pl-rs-reviews" aria-labelledby="pl-rs-reviews-title">
    <div class="pl-rs__inner">
        <h2 id="pl-rs-reviews-title" class="pl-rs__h2 pl-rs-new__h2 pl-rs-reviews__title">
            {% trans "Відгуки клієнтів на Google" %}
            <img src="{% static 'img/rozrobka-figma/google-g.svg' %}" width="50" height="50" alt="Google">
        </h2>
        <p class="pl-rs-reviews__score">
            <span class="pl-rs-reviews__mark">5,0</span>
            <img src="{% static 'img/rozrobka-figma/stars-5-large.svg' %}" width="143" height="27" alt="{% trans '5 зірок' %}">
            <span>{% trans "51 відгук на Google, станом на листопад 2026" %}</span>
        </p>
        <div class="pl-rs-reviews__track">
            {% for review in rozrobka_reviews %}
            <article class="pl-rs-reviews__card">
                <header class="pl-rs-reviews__who">
                    <p>{{ review.name }}</p>
                    <img src="{% static 'img/rozrobka-figma/stars-5-small.svg' %}" width="74" height="14" alt="{% trans '5 зірок' %}">
                    <img src="{% static 'img/rozrobka-figma/google-g.svg' %}" width="16" height="16" alt="Google">
                </header>
                <p>{{ review.text }}</p>
            </article>
            {% endfor %}
        </div>
        <a class="pl-rs-new__cta" href="https://maps.google.com/?cid=14470082583700063662" target="_blank" rel="noopener noreferrer">{% trans "Усі 51 відгук на Google" %} <span aria-hidden="true">↗</span></a>
    </div>
</section>
