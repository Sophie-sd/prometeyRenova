{% load i18n static %}
<div class="dc-carousel-nav{% if mobile %} dc-carousel-nav--mobile{% else %} dc-carousel-nav--desktop{% endif %}" data-carousel-nav="{{ target }}">
    <button type="button" class="dc-carousel-nav__btn" data-carousel-prev aria-controls="{{ target }}" aria-label="{% trans 'Назад' %}"><img src="{% static 'democorp/img/next.svg' %}" alt="" width="50" height="50"></button>
    <button type="button" class="dc-carousel-nav__btn" data-carousel-next aria-controls="{{ target }}" aria-label="{% trans 'Далі' %}"><img src="{% static 'democorp/img/prev.svg' %}" alt="" width="50" height="50"></button>
</div>
