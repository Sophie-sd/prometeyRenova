{% load i18n demotenant %}
<footer class="dc-footer">
    {% if footer_partners_visible and partners %}
    <div class="dc-footer__partners">
        {% include 'democorp/partials/partners_loop.html' %}
    </div>
    {% endif %}
    <div class="dc-footer__top">
        <div class="dc-footer__identity">
            <p class="dc-footer__brand" aria-hidden="true">
                <span class="dc-footer__mark">Prometey</span>
                <span class="dc-footer__mark">Labs</span>
            </p>
            <p class="dc-footer__copy">{% tenant_text blocks_map registry "header" "company_name" %} · {% now "Y" %}</p>
        </div>
        <div class="dc-footer__actions">
            <nav class="dc-footer__nav" aria-label="{% trans 'Футер' %}">
                <ul>
                    {% include 'democorp/partials/nav_links.html' %}
                </ul>
            </nav>
        </div>
    </div>
    <div class="dc-footer__bottom"></div>
</footer>
