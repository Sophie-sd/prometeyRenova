{% load i18n %}
{% if site %}
<div class="dc-sales-chrome"
     data-dc-sales-chrome
     data-tenant-id="{{ site.pk }}"
     data-dc-sales-page="{{ page|default:'home' }}">
    <button type="button"
            class="dc-sales-fab"
            data-dc-sales-open
            aria-expanded="false"
            aria-controls="dc-sales-panel"
            aria-label="{{ sales_fab }}">
        <span class="dc-sales-fab__mark" aria-hidden="true">i</span>
        <span class="dc-sales-fab__label">{{ sales_fab }}</span>
    </button>

    <div class="dc-sales-backdrop" data-dc-sales-close hidden></div>
    <aside class="dc-sales-panel" id="dc-sales-panel" role="dialog" aria-modal="true" aria-labelledby="dc-sales-panel-title" hidden>
        <div class="dc-sales-panel__head">
            <h2 id="dc-sales-panel-title" class="dc-sales-panel__title">{{ sales_title }}</h2>
            <button type="button" class="dc-sales-panel__x" data-dc-sales-close aria-label="{% trans "Закрити" %}">×</button>
        </div>
        <p class="dc-sales-panel__lead">{{ sales_lead }}</p>
        {% if sales_notes %}
        <ol class="dc-sales-panel__list">
            {% for note in sales_notes %}
            <li>
                <span class="dc-sales-panel__num" aria-hidden="true">{{ forloop.counter|stringformat:"02d" }}</span>
                <div>
                    <p class="dc-sales-panel__item-title">{{ note.title }}</p>
                    <p class="dc-sales-panel__item-body">{{ note.body }}</p>
                </div>
            </li>
            {% endfor %}
        </ol>
        {% endif %}
        <div class="dc-sales-panel__actions">
            <a class="dc-btn dc-btn--primary dc-sales-panel__cta" href="{% url 'democorp:admin_access' slug=site.slug %}">{% trans "Відкрити мою адмінку" %}</a>
            <button type="button" class="dc-sales-panel__hide" data-dc-sales-hide>{% trans "Не показувати" %}</button>
            <button type="button" class="dc-sales-panel__show" data-dc-sales-show hidden>{% trans "Показати підказки" %}</button>
        </div>
    </aside>
</div>
{% endif %}
