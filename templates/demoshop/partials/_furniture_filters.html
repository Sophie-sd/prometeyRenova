{% load i18n %}
{% for key, value in furniture_hidden %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}
{% for group in furniture_groups %}
<div class="ds-furn-filter" data-qa="furniture-filter-{{ group.key }}">
    <p class="ds-filter-sidebar__title">{{ group.title }}</p>
    <div class="ds-filter-chips">
        {% for item in group.items %}
        <a class="ds-filter-chip{% if item.active %} is-active{% endif %}" href="{{ item.url }}">{{ item.label }}</a>
        {% endfor %}
    </div>
</div>
{% endfor %}
