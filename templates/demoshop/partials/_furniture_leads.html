{% load i18n %}
<div class="ds-furn-leads" data-qa="furniture-leads">
    <details class="ds-furn-lead">
        <summary class="ds-btn ds-btn--outline ds-furn-lead__toggle">{% trans "Купити в 1 клік" %}</summary>
        <form class="ds-furn-lead__form"
              hx-post="{% url 'demoshop:furniture_quick_buy' shop_slug=shop.slug %}"
              hx-target="#ds-furn-quick-result"
              hx-swap="innerHTML">
            <input type="hidden" name="product_slug" value="{{ product.slug }}">
            <label class="ds-furn-field">
                <span>{% trans "Імʼя" %}</span>
                <input type="text" name="name" autocomplete="name" maxlength="120" required>
            </label>
            <label class="ds-furn-field">
                <span>{% trans "Телефон" %}</span>
                <input type="tel" name="phone" autocomplete="tel" inputmode="tel" maxlength="32" placeholder="+380" required>
            </label>
            <button type="submit" class="ds-btn ds-btn--primary">{% trans "Замовити" %}</button>
            <div id="ds-furn-quick-result" class="ds-furn-result-slot"></div>
        </form>
    </details>
    <details class="ds-furn-lead">
        <summary class="ds-btn ds-btn--outline ds-furn-lead__toggle">{% trans "Консультація дизайнера" %}</summary>
        <form class="ds-furn-lead__form"
              hx-post="{% url 'demoshop:furniture_consult' shop_slug=shop.slug %}"
              hx-target="#ds-furn-consult-result"
              hx-swap="innerHTML">
            <input type="hidden" name="product_slug" value="{{ product.slug }}">
            <label class="ds-furn-field">
                <span>{% trans "Імʼя" %}</span>
                <input type="text" name="name" autocomplete="name" maxlength="120" required>
            </label>
            <label class="ds-furn-field">
                <span>{% trans "Телефон" %}</span>
                <input type="tel" name="phone" autocomplete="tel" inputmode="tel" maxlength="32" placeholder="+380" required>
            </label>
            <button type="submit" class="ds-btn ds-btn--primary">{% trans "Записатися" %}</button>
            <div id="ds-furn-consult-result" class="ds-furn-result-slot"></div>
        </form>
    </details>
</div>
