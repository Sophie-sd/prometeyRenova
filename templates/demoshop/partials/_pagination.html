{% load i18n %}
{% if page_obj.paginator.num_pages > 1 %}
<nav class="ds-pagination" aria-label="{% trans "Пагінація" %}">
    {% if page_obj.has_previous %}
        <a href="?{% if base_qs %}{{ base_qs }}&{% endif %}page={{ page_obj.previous_page_number }}">‹</a>
    {% endif %}
    {% for num in page_obj.paginator.page_range %}
        {% if num == page_obj.number %}
            <span class="is-active">{{ num }}</span>
        {% else %}
            <a href="?{% if base_qs %}{{ base_qs }}&{% endif %}page={{ num }}">{{ num }}</a>
        {% endif %}
    {% endfor %}
    {% if page_obj.has_next %}
        <a href="?{% if base_qs %}{{ base_qs }}&{% endif %}page={{ page_obj.next_page_number }}">›</a>
    {% endif %}
</nav>
{% endif %}
