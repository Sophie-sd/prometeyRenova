{% load i18n fx_tags %}
<ul id="fx-home-prices" class="hf-rows"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
    <li class="hf-row"><span class="hf-row__key">{% trans "Лендінги" %}</span><span class="hf-row__val">{% fx_range 150 300 %}</span></li>
    <li class="hf-row"><span class="hf-row__key">{% trans "Корпоративні сайти" %}</span><span class="hf-row__val">{% fx_range 350 500 %}</span></li>
    <li class="hf-row"><span class="hf-row__key">{% trans "Інтернет-магазини" %}</span><span class="hf-row__val">{% fx_from 650 %}</span></li>
    <li class="hf-row"><span class="hf-row__key">{% trans "Веб-додатки / SaaS" %}</span><span class="hf-row__val">{% fx_range 1500 5000 %}</span></li>
</ul>
