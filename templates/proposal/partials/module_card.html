{% load i18n %}
<article class="prop-mod-row prop-reveal"
         data-prop-reveal
         data-mi="{% if module.number %}{{ module.number }}{% else %}{{ forloop.counter }}{% endif %}">
    <span class="prop-mod-row__num">{% if module.number %}{{ module.number|stringformat:"02d" }}{% else %}{{ forloop.counter|stringformat:"02d" }}{% endif %}</span>
    <h3 class="prop-mod-row__title">{{ module.get_localized_title }}</h3>
    {% if module.get_localized_description %}
    <p class="prop-mod-row__text">{{ module.get_localized_description }}</p>
    {% endif %}
</article>
